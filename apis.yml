name: Nature's Fynd
description: 'Nature''s Fynd is the consumer food brand of The Fynder Group, a fermentation
  biotechnology company that grows a complete protein (Fy Protein) from an extremophile
  fungus originally discovered in the geothermal springs of Yellowstone National Park.
  The Fynder Group operates as the central R&D, fermentation, and scaled-manufacturing
  hub behind Fynder Ingredients (specialty food and beverage ingredients), FynderBio
  (oral biopharmaceuticals), and Hydefy (bio-based performance materials). Nature''s
  Fynd sells meat- and dairy-alternative consumer foods made from Fy Protein. Backed
  by SoftBank Vision Fund and added to the API Evangelist network as a company
  profile; as of this enrichment pass the company publishes no public API, developer
  portal, or API documentation.'
